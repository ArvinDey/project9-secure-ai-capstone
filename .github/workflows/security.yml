name: AI Security Gates

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: "Gate 1 - Bandit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install bandit==1.9.4
      # Medium is included so the assessment's eval() example is caught.
      - name: Scan Python source
        run: bandit -r . -ll --exclude .git,.venv,venv,ai-lab,.audit-tools

  safety:
    name: "Gate 2 - Safety"
    needs: bandit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Legacy check + public database for this account-free teaching lab.
      - name: Install isolated lab scanner
        run: python -m pip install safety==2.3.5 "marshmallow<4" "click<8.2" "setuptools<81"
      - name: Fetch public database snapshot
        env:
          DB_REV: 7675093dc7ca5baa7aad5e9898e67062a7780dc0
        run: |
          mkdir -p "$RUNNER_TEMP/safety-db"
          for file in insecure.json insecure_full.json; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/pyupio/safety-db/$DB_REV/data/$file" \
              -o "$RUNNER_TEMP/safety-db/$file"
          done
      # Attribution and coverage: https://github.com/pyupio/safety-db
      # Blocks every reported vulnerability, including High and Critical.
      - name: Scan declared dependencies
        run: >-
          safety --disable-telemetry check -r requirements_pinned.txt
          --db "$RUNNER_TEMP/safety-db"
          --disable-audit-and-monitor --output text

  gitleaks:
    name: "Gate 3 - Gitleaks"
    needs: safety
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commit additions for secrets
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              range="$AFTER"
            else
              range="$BEFORE..$AFTER"
            fi
          else
            range="-1"
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --verbose --redact --log-opts="$range" .

  injection:
    name: "Gate 4 - Prompt Injection Scanner"
    needs: gitleaks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Scan application prompts
        run: python inject_scanner.py
